<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Add New Lead</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> <div class="container mt-5" style="max-width: 600px;">
    <!-- Alert Messages inside Form -->
     {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} mb-3" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <div class="card p-4 shadow rounded bg-white">
            <h3 class="mb-4 text-center text-primary">📋 Add Customer Details</h3>
            <hr>

             <!--add name and email form fields-->
            <form method="POST" action="/add">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Amit Kumar" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. amit@gmail.com" required>
                </div>

                <!--add mobile and company form fields-->
                <div class="mb-3">
                    <label class="form-label fw-bold">Mobile Number <span class="text-danger">*</span></label>
                    <input type="text" name="mobile" class="form-control" placeholder="10-digit mobile number" pattern="[0-9]{10,15}" title="Please enter valid digits" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Company Name</label>
                    <input type="text" name="company" class="form-control" placeholder="Optional (e.g. Anand Motors)">
                </div>

                 <!--add source and status dropdowns-->
                <div class="mb-3">
                    <label class="form-label fw-bold">Lead Source</label>
                    <select name="source" class="form-select">
                        <option value="Website">Website</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="Referral">Referral</option>
                        <option value="Cold Call">Cold Call</option>
                        <option value="Walk-in">Walk-in</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Pipeline Status</label>
                    <select name="status" class="form-select">
                        <option value="New" selected>New</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Qualified">Qualified</option>
                        <option value="Lost">Lost</option>
                    </select>
            
            </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
