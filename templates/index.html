<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Capture Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .card-analytics { transition: transform 0.2s; }
        .card-analytics:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-light"> 
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            
            <h2 class="text-dark m-0">📊 Lead Management Dashboard</h2>
            
            <a href="/add" class="btn btn-primary btn-lg">+ Add New Lead</a>

        </div>
         <!-- Alert Messages (Success/Error Notification) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show mb-4" role="alert">
                
                {{ message }}
                
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
